# Pipeline manifest — single source of truth for phase execution order.
#
# run_full_pipeline.py derives its execution order from this file.
# Adding a phase: add an entry here AND implement the module. Never add a
# phase to the orchestrator without a manifest entry — the anti-drift test
# will catch it.
#
# Fields per phase:
#   id          Unique string identifier (used by --start-from)
#   name        Human-readable label for logs
#   module      Python module path (null for manual phases)
#   callable    Function name within the module (null for manual phases)
#   inputs      List of file paths relative to repo root (documentation + tests)
#   outputs     List of file paths relative to repo root
#   depends_on  Phase IDs this phase reads from; must appear earlier in the list
#               (validated). Not enforced at runtime: dependents of a skipped
#               or failed optional phase still run.
#   schema_version  Expected _schema_version on output records
#   resumable   Whether the phase can safely be re-run from scratch
#   manual      true = operator action required; orchestrator pauses here
#   requires_file   If this path is missing: SKIPPED when optional, else FAILED
#   optional    true = a missing module, input file, credential or
#               requires_file is SKIPPED, a failure doesn't stop the run, and a
#               manual phase with no output is SKIPPED instead of pausing
#   accepts_force   true = the callable takes force= and honours --force /
#                   --force-errors (API phases only; anti-drift tested against
#                   the real signature)
#   instructions    Shown to operator when manual=true and output is missing

schema_version: 6

phases:

  - id: "1"
    name: scrobble ingest
    module: pipeline.ingest_scrobbles
    callable: ingest
    inputs:
      - inputs/lastfm_export.json
    outputs:
      - scrobbles.jsonl
    depends_on: []
    schema_version: 6
    resumable: true

  - id: "2"
    name: dedupe
    module: pipeline.dedupe
    callable: dedupe
    inputs:
      - scrobbles.jsonl
    outputs:
      - tracks_skeleton.jsonl
    depends_on: ["1"]
    schema_version: 6
    resumable: true

  - id: "A"
    name: iTunes XML enrichment
    module: pipeline.enrich_apple_library
    callable: enrich
    inputs:
      - tracks_skeleton.jsonl
      - inputs/apple_music_library.xml
    outputs:
      - tracks_with_apple.jsonl
    depends_on: ["2"]
    schema_version: 6
    resumable: true

  - id: "B"
    name: "Spotify ID resolution (legacy last-resort)"
    module: pipeline.enrich_spotify_ids
    callable: enrich
    inputs:
      - tracks_with_apple.jsonl
    outputs:
      - tracks_with_spotify.jsonl
    depends_on: ["A"]
    schema_version: 6
    resumable: true
    optional: true   # skips gracefully when no Spotify credentials are present

  - id: "3a"
    name: "TuneMyMusic export (legacy)"
    module: pipeline.export_tunemymusic
    callable: export
    inputs:
      # export() reads the skeleton directly — it only needs artist/track/album,
      # so it does not depend on Phase A's enrichment. Ordered after A anyway.
      - tracks_skeleton.jsonl
    outputs:
      - inputs/tunemymusic_upload.csv
    depends_on: ["A"]
    schema_version: 6
    resumable: true
    optional: true

  - id: "3b"
    name: "TuneMyMusic + Exportify (manual, legacy)"
    module: ~
    callable: ~
    inputs:
      - inputs/tunemymusic_upload.csv
    outputs:
      - inputs/exportify.csv
    depends_on: ["3a"]
    schema_version: ~
    resumable: false
    manual: true
    optional: true   # #37: Phase 5a/5b supersede this route; no longer blocks a run
    instructions: |
      Superseded by Phase 5a/5b (issue #37) — this manual round-trip is no
      longer required to get audio features. Still supported for tracks the
      automated chain misses:
      1. Upload inputs/tunemymusic_upload.csv to TuneMyMusic (https://tunemymusic.com)
      2. Transfer the playlist to Spotify
      3. Run Exportify (https://exportify.net) on that Spotify playlist
      4. Save the CSV as inputs/exportify.csv
      5. Re-run with --start-from 3c

  - id: "3c"
    name: "Exportify merge (legacy)"
    module: pipeline.merge_exportify
    callable: merge
    inputs:
      - tracks_with_spotify.jsonl
      - tracks_with_apple.jsonl
      - inputs/exportify.csv
    outputs:
      - tracks_with_audio.jsonl
    depends_on: ["3b"]
    schema_version: 6
    resumable: true
    optional: true
    requires_file: inputs/exportify.csv

  - id: "4"
    name: Last.fm + MusicBrainz enrichment
    module: pipeline.enrich_metadata
    callable: enrich
    accepts_force: true
    inputs:
      - tracks_with_audio.jsonl
      - tracks_with_spotify.jsonl
      - tracks_with_apple.jsonl
    outputs:
      - tracks_with_metadata.jsonl
    depends_on: ["A"]
    schema_version: 6
    resumable: true

  - id: "4b"
    name: Discogs styles
    module: pipeline.enrich_discogs
    callable: enrich
    accepts_force: true
    inputs:
      - tracks_with_metadata.jsonl
    outputs:
      - tracks_with_discogs.jsonl
    depends_on: ["4"]
    schema_version: 6
    resumable: true
    optional: true

  - id: "4c"
    name: genre derivation
    module: pipeline.derive_genres
    callable: derive
    inputs:
      # 4b is optional (it needs a DISCOGS_TOKEN); this phase is not. When 4b
      # drops out the orchestrator hands 4c Phase 4's output; run standalone,
      # derive() falls back to tracks_with_metadata.jsonl over a stale discogs file.
      - tracks_with_discogs.jsonl
    outputs:
      - tracks_with_genres.jsonl
    depends_on: ["4b"]
    schema_version: 6
    resumable: true

  - id: "4d"
    name: genre backfill (artist-level)
    module: pipeline.enrich_genre_backfill
    callable: enrich
    accepts_force: true
    inputs:
      - tracks_with_genres.jsonl
    outputs:
      - tracks_with_genre_backfill.jsonl
    depends_on: ["4c"]
    schema_version: 6
    resumable: true
    optional: true

  # 5a must stay ahead of 4e despite its id (ids are stable labels; list order
  # is execution order). 4e clusters on `isrc`; without it identity falls back
  # to normalized names, which re-key when normalization changes and orphan
  # human-edited fields.
  - id: "5a"
    name: "ISRC resolution (MusicBrainz -> Deezer)"
    module: pipeline.resolve_isrcs
    callable: enrich
    accepts_force: true
    inputs:
      - tracks_with_genre_backfill.jsonl
    outputs:
      - tracks_with_isrcs.jsonl
    depends_on: ["4d"]
    schema_version: 6
    resumable: true

  - id: "4e"
    name: identity resolution
    module: pipeline.resolve_identity
    callable: resolve
    inputs:
      - tracks_with_isrcs.jsonl
    outputs:
      - tracks_resolved.jsonl
    depends_on: ["5a"]
    schema_version: 6
    resumable: true

  - id: "5"
    name: Apple Music availability
    module: pipeline.check_apple_music
    callable: check
    accepts_force: true
    inputs:
      - tracks_resolved.jsonl
    outputs:
      - tracks_with_availability.jsonl
    depends_on: ["4e"]
    schema_version: 6
    resumable: true

  - id: "5b"
    name: "ReccoBeats audio features"
    module: pipeline.enrich_audio_features
    callable: enrich
    accepts_force: true
    inputs:
      - tracks_with_availability.jsonl
    outputs:
      - tracks_with_features.jsonl
    depends_on: ["5"]
    schema_version: 6
    resumable: true

  - id: "6"
    name: mood classification
    module: pipeline.classify_moods
    callable: classify
    inputs:
      - tracks_with_features.jsonl
      # mood_audit.csv (repo root) is canonical and the runtime default (#66,
      # #83/F-06). Phase 6 warns about and ignores inputs/existing_audit.csv
      # unless audit_path=INPUT_EXISTING_AUDIT is passed explicitly.
      - mood_audit.csv
    outputs:
      - tracks_with_moods.jsonl
    depends_on: ["5b", "3c"]
    schema_version: 6
    resumable: true
    optional: true

  - id: "7"
    name: saturation + curation
    module: pipeline.apply_taste_profile
    callable: apply
    inputs:
      - tracks_with_moods.jsonl
      - taste_profile.md
    outputs:
      - tracks_with_taste.jsonl
    depends_on: ["6"]
    schema_version: 6
    resumable: true
    optional: true
    requires_file: taste_profile.md

  - id: "8"
    name: final merge
    module: pipeline.update_tracks
    callable: update
    inputs:
      - tracks_with_taste.jsonl
    outputs:
      - tracks.jsonl
    depends_on: ["7"]
    schema_version: 6
    resumable: true
