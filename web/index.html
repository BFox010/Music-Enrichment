<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-density="comfortable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listening Atlas — Music Library Analytics</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load fonts without blocking first paint: applied as `print` (ignored for
       screen layout) until the stylesheet loads, then swapped to `all`. Text
       paints immediately in a fallback face (display=swap). -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </noscript>

  <link rel="stylesheet" href="themes.css" />

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#09090c" />
      <g transform="translate(30,22)" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="44" x2="0" y2="30" />
        <line x1="10" y1="44" x2="10" y2="16" />
        <line x1="20" y1="44" x2="20" y2="24" />
        <line x1="30" y1="44" x2="30" y2="6" />
        <line x1="40" y1="44" x2="40" y2="20" />
      </g>
      <circle cx="50" cy="50" r="3" fill="#a78bfa" />
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!-- ngrok's free tier returns an HTML interstitial instead of JSON unless
       this header is present; add it to same-origin requests so the SPA's
       API fetches always receive JSON. The shim also attaches the dashboard
       token to mutating (non-GET) same-origin requests so the server accepts
       them — the token comes from same-origin GET /api/config, which a
       cross-origin page cannot read (no CORS). Installed before any component runs. -->
  <script>
    (function () {
      var _fetch = window.fetch.bind(window);
      // Fetch the token once via the raw fetch (avoid recursing through the wrapper).
      var _tokenPromise = _fetch("/api/config", { headers: { "ngrok-skip-browser-warning": "true" } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { return (d && d.token) || ""; })
        .catch(function () { return ""; });
      window.fetch = function (input, init) {
        init = init || {};
        var url = typeof input === "string" ? input : (input && input.url) || "";
        var sameOrigin = !/^https?:\/\//i.test(url) || url.indexOf(location.origin) === 0;
        if (!sameOrigin) return _fetch(input, init);
        var method = (init.method || (input && input.method) || "GET").toUpperCase();
        var send = function (token) {
          var h = new Headers((init && init.headers) || (input && input.headers) || {});
          h.set("ngrok-skip-browser-warning", "true");
          if (token && method !== "GET" && method !== "HEAD") h.set("X-Dashboard-Token", token);
          return _fetch(input, Object.assign({}, init, { headers: h }));
        };
        // Mutating requests wait for the token; reads go immediately.
        return (method !== "GET" && method !== "HEAD") ? _tokenPromise.then(send) : send("");
      };
    })();
  </script>

  <!-- React (production, pinned) -->
  <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- data (defines window.MUSIC_DATA) -->
  <script defer src="data/library.js"></script>

  <!-- shared pure data transforms (no JSX); loaded before app.bundle.js so its
       functions/constants are globals the bundle uses, and so web/data-worker.js
       can importScripts the same code off the main thread. -->
  <script defer src="data-processing.js"></script>

  <!-- motion layer: the shared pointer loop (card spotlight + magnetic
       controls), the FLIP helpers the ranked lists use to re-rank, and the
       View Transitions wrapper for page switches. Framework-free; the JSX
       calls into it via window.MOTION. -->
  <script defer src="motion.js"></script>

  <!-- ambient backdrop: a slow WebGL mesh gradient tinted by the genres
       currently on screen. Degrades to the static --bg-grad if WebGL is
       unavailable. -->
  <script defer src="ambient.js"></script>

  <!-- app: pre-compiled from the *.jsx sources by scripts/build_frontend.mjs.
       Run `npm run build` (or `npm run dev` to rebuild on save) after editing any .jsx. -->
  <script defer src="app.bundle.js"></script>

  <!-- ECharts is loaded lazily by the app (prefetched on idle, or on first chart-view
       open) via ensureECharts() — see web/echarts-charts.jsx. Not loaded up front. -->
</body>
</html>
