<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-density="comfortable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listening Atlas — Music Library Analytics</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="themes.css" />

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#09090c" />
      <g transform="translate(30,22)" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="44" x2="0" y2="30" />
        <line x1="10" y1="44" x2="10" y2="16" />
        <line x1="20" y1="44" x2="20" y2="24" />
        <line x1="30" y1="44" x2="30" y2="6" />
        <line x1="40" y1="44" x2="40" y2="20" />
      </g>
      <circle cx="50" cy="50" r="3" fill="#a78bfa" />
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!-- ngrok's free tier returns an HTML interstitial instead of JSON unless
       this header is present; add it to same-origin requests so the SPA's
       API fetches always receive JSON. Installed before any component runs. -->
  <script>
    (function () {
      var _fetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        init = init || {};
        var url = typeof input === "string" ? input : (input && input.url) || "";
        var sameOrigin = !/^https?:\/\//i.test(url) || url.indexOf(location.origin) === 0;
        if (sameOrigin) {
          var h = new Headers((init && init.headers) || (input && input.headers) || {});
          h.set("ngrok-skip-browser-warning", "true");
          init = Object.assign({}, init, { headers: h });
        }
        return _fetch(input, init);
      };
    })();
  </script>

  <!-- React (production, pinned) -->
  <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- data (defines window.MUSIC_DATA) -->
  <script defer src="data/library.js"></script>

  <!-- app: pre-compiled from the *.jsx sources by scripts/build_frontend.mjs.
       Run `npm run build` (or `npm run dev` to rebuild on save) after editing any .jsx. -->
  <script defer src="app.bundle.js"></script>

  <!-- ECharts is loaded lazily by the app (prefetched on idle, or on first chart-view
       open) via ensureECharts() — see web/echarts-charts.jsx. Not loaded up front. -->
</body>
</html>
