name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # The suite is self-contained (fakes/temp files, no secrets or network),
        # and includes the manifest anti-drift guard that catches phase-wiring drift.
        run: python -m pytest tests/ -q

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run JS test suite
        # Plain `node --test`, no bundler: web/data-processing.js has no module
        # system by design (a <script> global and importScripts() in the worker).
        # Catches what pytest can't, e.g. the browser's join logic diverging
        # from the server's (#83/F-03).
        run: npm test

      - name: Build frontend and check for stale committed output
        # A change to web/*.jsx must ship with a rebuilt web/app.bundle.js —
        # there is no in-browser transpile. Fail here rather than let a PR
        # merge with a bundle that doesn't match its own sources.
        run: |
          npm run build
          git diff --exit-code -- web/app.bundle.js web/app.bundle.js.map
