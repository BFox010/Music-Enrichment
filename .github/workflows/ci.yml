name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA; the comment names the release.
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint
        # Pyflakes rules only (pyproject.toml): unused imports, undefined names.
        run: ruff check .

      - name: Run test suite
        # The suite is self-contained (fakes/temp files, no secrets or network),
        # and includes the manifest anti-drift guard that catches phase-wiring drift.
        run: python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run JS test suite
        # Plain `node --test`, no bundler: web/data-processing.js has no module
        # system by design (a <script> global and importScripts() in the worker).
        # Catches what pytest can't, e.g. the browser's join logic diverging
        # from the server's (#83/F-03).
        run: npm test

      - name: Build frontend and check for stale committed output
        # A change to web/*.jsx must ship with a rebuilt web/app.bundle.js —
        # there is no in-browser transpile. Fail here rather than let a PR
        # merge with a bundle that doesn't match its own sources.
        run: |
          npm run build
          git diff --exit-code -- web/app.bundle.js web/app.bundle.js.map
